<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Ram Chat</title><style>html,body{margin:0;width:100%;height:100%;background:#e9f5f1}#ram-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:linear-gradient(145deg,#075e54,#0b806f);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;transition:opacity .45s ease,visibility .45s ease}#ram-splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-box{text-align:center;animation:ramPop .65s ease-out}.splash-logo{width:112px;height:112px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#fff;box-shadow:0 12px 38px #0005;position:relative}.splash-logo:before{content:"";position:absolute;width:64px;height:48px;border-radius:50%;background:#25d366}.splash-logo:after{content:"";position:absolute;bottom:21px;right:21px;border-style:solid;border-width:11px 0 0 15px;border-color:transparent transparent transparent #25d366;transform:rotate(20deg)}.splash-phone{position:relative;z-index:2;color:#fff;font-size:31px;font-weight:900;line-height:1}.splash-title{margin-top:22px;font-size:30px;font-weight:900;letter-spacing:.2px}.splash-encrypted{margin-top:9px;font-size:14px;font-weight:600;opacity:.9;letter-spacing:.15px}.splash-design{margin-top:38px;font-size:13px;font-weight:600;opacity:.72;letter-spacing:.4px}.splash-dots{margin-top:20px;display:flex;justify-content:center;gap:6px}.splash-dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.45;animation:ramDot 1s infinite}.splash-dots i:nth-child(2){animation-delay:.15s}.splash-dots i:nth-child(3){animation-delay:.3s}@keyframes ramPop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}@keyframes ramDot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}</style></head><body><div id="ram-splash"><div class="splash-box"><div class="splash-logo"><span class="splash-phone">☎</span></div><div class="splash-title">Ram Chat</div><div class="splash-encrypted">🔒 End-to-End Encrypted</div><div class="splash-design">Design by Ram</div><div class="splash-dots"><i></i><i></i><i></i></div></div></div><div id="root"></div><script>window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('ram-splash');if(s)s.classList.add('hide')},2000)});</script><script type="module" src="/src/main.jsx"></script></body></html>
